name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Apple Silicon, macOS 26. Dockyard needs both: the package is
    # swift-tools 6.2 with a macOS 26 deployment target, and `apple/container`
    # only exists on ARM.
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v7

      - name: Report the toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Install the Metal Toolchain
        # SwiftTerm ships a build plugin that needs it. Not preinstalled.
        run: xcodebuild -downloadComponent MetalToolchain

      # The first resolve pulls ~200 MB across 16 repositories, which is most
      # of a cold run. Keyed on the resolved versions, so it only re-fetches
      # when a dependency actually moves.
      - name: Cache resolved packages
        uses: actions/cache@v6
        with:
          path: |
            .spm-cache
            Packages/DockyardCore/.build
          key: spm-${{ runner.os }}-${{ hashFiles('**/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      # Compiling and running are separate steps so a red run says which it was
      # without anyone opening the log.
      - name: Compile the tests
        working-directory: Packages/DockyardCore
        # pipefail matters: without it the pipeline reports tee's status and a
        # compile failure passes straight through this step.
        run: |
          set -o pipefail
          swift build --build-tests 2>&1 | tee ../../test-build.log

      - name: Run the unit tests
        working-directory: Packages/DockyardCore
        run: swift test --skip-build --xunit-output ../../test-results.xml

      - name: Build the app
        run: |
          set -o pipefail
          xcodebuild build \
            -project Dockyard.xcodeproj \
            -scheme Dockyard \
            -configuration Debug \
            -destination 'generic/platform=macOS' \
            -clonedSourcePackagesDirPath .spm-cache \
            -skipPackagePluginValidation \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= \
            2>&1 | tee app-build.log

      # Last, so it covers every step above it. The job summary is for whoever
      # opens the run; the annotations come back from the public API, so a red
      # build can be diagnosed without repository access.
      - name: Report what failed
        if: failure()
        run: |
          emit() {
            echo "## $1" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            cat >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          }

          for log in test-build.log app-build.log; do
            [[ -f "$log" ]] || continue
            if grep -qE "error:" "$log"; then
              grep -E "error:" "$log" | sort -u | head -40 | emit "$log"
              grep -E "error:" "$log" | sort -u | head -20 | while IFS= read -r line; do
                echo "::error title=${log}::${line}"
              done
            fi
          done

          if [[ -f test-results.xml ]]; then
            python3 - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import xml.etree.ElementTree as ET
          for case in ET.parse("test-results.xml").getroot().iter("testcase"):
              for failure in case.iter("failure"):
                  message = (failure.get("message") or "").replace("\n", " ")[:400]
                  print(f'::error title={case.get("name")}::{message}')
          PY
          fi

          # Tail of whichever log exists, in case nothing matched "error:" —
          # silence here would otherwise look like there was nothing to report.
          for log in app-build.log test-build.log; do
            [[ -f "$log" ]] && tail -30 "$log" | emit "tail of $log"
          done
          cat "$GITHUB_STEP_SUMMARY"

      # The integration tests are deliberately not run here. They need a live
      # `container-apiserver`, which needs Virtualization.framework, which a
      # GitHub runner — itself a VM — cannot nest. They run on a developer's
      # machine with DOCKYARD_INTEGRATION=1; see README.md.
