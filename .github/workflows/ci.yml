name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Apple Silicon, macOS 26, Xcode 26.6. Dockyard needs all three: the
    # package is swift-tools 6.2, the deployment target is macOS 26, and
    # `apple/container` only exists on ARM.
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v7

      - name: Report the toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Install the Metal Toolchain
        # SwiftTerm ships a build plugin that needs it. Not preinstalled.
        run: xcodebuild -downloadComponent MetalToolchain

      # The first resolve pulls ~200 MB across 16 repositories, which is most
      # of a cold run. Keyed on the resolved versions, so it only re-fetches
      # when a dependency actually moves.
      - name: Cache resolved packages
        uses: actions/cache@v6
        with:
          path: |
            .spm-cache
            Packages/DockyardCore/.build
          key: spm-${{ runner.os }}-${{ hashFiles('**/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      # Compiling and running are separate steps so a red run says which it was
      # without anyone opening the log: the runner has Xcode 26.6 while a
      # developer may be on something newer, and "the tests failed" reads very
      # differently from "the tests did not build".
      - name: Compile the tests
        working-directory: Packages/DockyardCore
        run: swift build --build-tests 2>&1 | tee build.log

      - name: Run the unit tests
        working-directory: Packages/DockyardCore
        run: swift test --skip-build --xunit-output test-results.xml

      - name: Report what failed
        if: failure()
        working-directory: Packages/DockyardCore
        run: |
          {
            echo "## Failures"
            echo
            if [[ -f test-results.xml ]]; then
              echo '```'
              python3 - <<'PY'
          import xml.etree.ElementTree as ET
          for case in ET.parse("test-results.xml").getroot().iter("testcase"):
              for failure in case.iter("failure"):
                  print(f'{case.get("classname")}.{case.get("name")}')
                  print(f'  {failure.get("message")}')
          PY
              echo '```'
            else
              echo "The tests did not get as far as running. Last lines of the build:"
              echo '```'
              tail -40 build.log 2>/dev/null || echo "(no build log)"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$GITHUB_STEP_SUMMARY"

          # Also as annotations: the step summary is only readable by someone
          # opening the run page, while annotations come back from the public
          # API, so a failure can be diagnosed without repository access.
          if [[ -f test-results.xml ]]; then
            python3 - <<'PY'
          import xml.etree.ElementTree as ET
          for case in ET.parse("test-results.xml").getroot().iter("testcase"):
              for failure in case.iter("failure"):
                  message = (failure.get("message") or "").replace("\n", " ")[:400]
                  print(f'::error title={case.get("name")}::{message}')
          PY
          else
            grep -E "error:" build.log 2>/dev/null | head -10 | while read -r line; do
              echo "::error title=Build::${line}"
            done
          fi

      - name: Build the app
        run: |
          xcodebuild build \
            -project Dockyard.xcodeproj \
            -scheme Dockyard \
            -configuration Debug \
            -destination 'generic/platform=macOS' \
            -clonedSourcePackagesDirPath .spm-cache \
            -skipPackagePluginValidation \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM=

      # The integration tests are deliberately not run here. They need a live
      # `container-apiserver`, which needs Virtualization.framework, which a
      # GitHub runner — itself a VM — cannot nest. They run on a developer's
      # machine with DOCKYARD_INTEGRATION=1; see README.md.
